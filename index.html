<!-- Todos Contra Tebas - Control de subida de videos -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600;700&display=swap');

  :root {
    --bg: #0a0a0f;
    --panel: #141420;
    --panel-2: #1c1c2b;
    --gold: #f4c542;
    --gold-dim: #b8932e;
    --red: #e23b3b;
    --green: #2ecc71;
    --ink: #f5f3ea;
    --muted: #8a8a9c;
    --border: #2a2a3d;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  #tct-app {
    font-family: 'Oswald', sans-serif;
    background:
      radial-gradient(circle at 20% -10%, rgba(244,197,66,.08), transparent 40%),
      radial-gradient(circle at 90% 110%, rgba(226,59,59,.07), transparent 45%),
      var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding: 28px 20px 80px;
  }

  .tct-wrap { max-width: 1100px; margin: 0 auto; }

  .tct-header {
    text-align: center;
    margin-bottom: 8px;
    position: relative;
  }
  .tct-header h1 {
    font-family: 'Anton', sans-serif;
    font-size: clamp(38px, 8vw, 82px);
    line-height: .92;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: linear-gradient(180deg, var(--gold), var(--gold-dim));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 4px 30px rgba(244,197,66,.15);
  }
  .tct-header .sub {
    font-weight: 300;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--muted);
    font-size: clamp(11px, 2vw, 15px);
    margin-top: 6px;
  }
  .tct-spear {
    color: var(--red);
    font-weight: 700;
  }

  /* Tabs / semana */
  .tct-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 20px;
    margin: 26px 0 22px;
  }
  .tct-week-nav { display: flex; align-items: center; gap: 12px; }
  .tct-week-nav .label {
    font-family: 'Anton', sans-serif;
    font-size: 22px;
    letter-spacing: 1px;
    min-width: 120px;
    text-align: center;
  }
  .tct-week-nav .deadline {
    font-size: 12px; color: var(--muted); font-weight: 300; letter-spacing: 1px;
  }

  .btn {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    border: none;
    border-radius: 9px;
    padding: 10px 16px;
    cursor: pointer;
    transition: transform .12s ease, filter .12s ease, background .12s;
    font-size: 13px;
  }
  .btn:active { transform: scale(.96); }
  .btn-gold { background: var(--gold); color: #1a1500; }
  .btn-gold:hover { filter: brightness(1.08); }
  .btn-ghost { background: var(--panel-2); color: var(--ink); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--gold-dim); }
  .btn-red { background: var(--red); color: #fff; }
  .btn-sm { padding: 6px 11px; font-size: 11px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  .tct-actions { display: flex; gap: 10px; flex-wrap: wrap; }

  /* Grid de columnas */
  .tct-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  @media (max-width: 800px) { .tct-cols { grid-template-columns: 1fr; } }

  .tct-col h2 {
    font-family: 'Anton', sans-serif;
    font-size: 20px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .tct-col h2 .pill {
    font-family: 'Oswald'; font-size: 12px; font-weight: 600;
    background: var(--panel-2); color: var(--muted);
    border: 1px solid var(--border); padding: 3px 9px; border-radius: 20px;
  }
  .tct-col.cortos h2 { color: var(--gold); }
  .tct-col.largos h2 { color: #6db3ff; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 16px;
    margin-bottom: 13px;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    background: var(--muted);
  }
  .card.done::before { background: var(--green); }
  .card.fail::before { background: var(--red); }
  .card.banned { opacity: .55; }
  .card.banned::after {
    content: 'EXPULSADO'; position: absolute; top: 12px; right: 14px;
    font-family: 'Anton'; color: var(--red); font-size: 13px; letter-spacing: 2px;
    border: 1.5px solid var(--red); padding: 2px 8px; border-radius: 5px;
    transform: rotate(6deg);
  }

  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .card-name { font-size: 20px; font-weight: 600; letter-spacing: .5px; }
  .card-status {
    font-family: 'Anton'; font-size: 15px; letter-spacing: 1px; white-space: nowrap;
  }
  .card-status .num { font-size: 22px; }
  .s-ok { color: var(--green); }
  .s-bad { color: var(--red); }
  .s-pend { color: var(--gold); }

  .req-note {
    font-size: 11px; color: var(--muted); font-weight: 300;
    text-transform: uppercase; letter-spacing: 1px; margin-top: 2px;
  }

  .links { margin-top: 12px; display: flex; flex-direction: column; gap: 7px; }
  .link-row {
    display: flex; align-items: center; gap: 8px;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 10px;
  }
  .link-row a {
    color: var(--gold); text-decoration: none; font-size: 13px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
  }
  .link-row a:hover { text-decoration: underline; }
  .link-row .del { color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; }
  .link-row .del:hover { color: var(--red); }

  .add-link { display: flex; gap: 7px; margin-top: 10px; }
  .add-link input {
    flex: 1; background: var(--panel-2); border: 1px solid var(--border);
    color: var(--ink); border-radius: 8px; padding: 8px 11px;
    font-family: 'Oswald'; font-size: 13px;
  }
  .add-link input:focus { outline: none; border-color: var(--gold-dim); }

  .empty {
    text-align: center; color: var(--muted); font-weight: 300;
    padding: 30px 10px; border: 1.5px dashed var(--border); border-radius: 12px;
  }

  /* Modal */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,.7);
    display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px;
    backdrop-filter: blur(3px);
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 28px; width: 100%; max-width: 420px;
  }
  .modal.modal-wide { max-width: 860px; max-height: 85vh; display: flex; flex-direction: column; }
  .modal h3 {
    font-family: 'Anton'; font-size: 26px; letter-spacing: 1px;
    text-transform: uppercase; margin-bottom: 18px; color: var(--gold);
  }

  .hist-tabs { display: flex; gap: 8px; margin: 6px 0 16px; }
  .hist-tab {
    font-family: 'Oswald'; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
    font-size: 13px; padding: 9px 16px; border-radius: 9px; cursor: pointer;
    background: var(--panel-2); color: var(--muted); border: 1px solid var(--border);
  }
  .hist-tab.active { background: rgba(244,197,66,.12); color: var(--gold); border-color: var(--gold); }
  .hist-body { overflow: auto; flex: 1; }

  .hist-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .hist-table th, .hist-table td {
    padding: 9px 10px; text-align: center; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  .hist-table th {
    position: sticky; top: 0; background: var(--panel);
    font-family: 'Oswald'; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
    font-size: 11px; color: var(--muted);
  }
  .hist-table td.nm { text-align: left; font-weight: 600; font-size: 14px; }
  .hist-table td.nm small { display:block; color: var(--muted); font-weight: 300; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .cell-ok { color: var(--green); font-weight: 700; }
  .cell-bad { color: var(--red); font-weight: 700; }
  .cell-tag { font-size: 10px; color: var(--muted); display: block; }
  .hist-week-h small { display:block; font-weight:300; color:var(--muted); font-size:10px; letter-spacing:0; text-transform:none; }

  .person-card { background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .person-card .ph { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .person-card .ph .nm { font-size: 18px; font-weight: 600; }
  .person-card .ph .rate { font-family:'Anton'; font-size: 20px; }
  .streak { display: flex; gap: 6px; flex-wrap: wrap; }
  .streak .dot {
    width: 30px; height: 30px; border-radius: 7px; display:flex; align-items:center; justify-content:center;
    font-family:'Oswald'; font-weight:600; font-size:11px; border:1px solid var(--border);
  }
  .streak .dot.ok { background: rgba(46,204,113,.18); color: var(--green); border-color: rgba(46,204,113,.4); }
  .streak .dot.bad { background: rgba(226,59,59,.15); color: var(--red); border-color: rgba(226,59,59,.4); }
  .field { margin-bottom: 16px; }
  .field label {
    display: block; font-size: 12px; text-transform: uppercase;
    letter-spacing: 1.5px; color: var(--muted); margin-bottom: 6px;
  }
  .field input {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border);
    color: var(--ink); border-radius: 9px; padding: 11px 13px;
    font-family: 'Oswald'; font-size: 15px;
  }
  .field input:focus { outline: none; border-color: var(--gold); }
  .type-toggle { display: flex; gap: 10px; }
  .type-toggle button {
    flex: 1; background: var(--panel-2); border: 1.5px solid var(--border);
    color: var(--ink); border-radius: 9px; padding: 12px; cursor: pointer;
    font-family: 'Oswald'; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1px; font-size: 13px; transition: all .12s;
  }
  .type-toggle button.active { border-color: var(--gold); background: rgba(244,197,66,.12); color: var(--gold); }
  .modal-foot { display: flex; gap: 10px; margin-top: 8px; }
  .modal-foot .btn { flex: 1; }

  .stat-strip {
    display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 22px;
    justify-content: center;
  }
  .stat {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 22px; text-align: center; min-width: 100px;
  }
  .stat .n { font-family: 'Anton'; font-size: 30px; line-height: 1; }
  .stat .l { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin-top: 4px; }
  .stat.g .n { color: var(--green); }
  .stat.r .n { color: var(--red); }
  .stat.y .n { color: var(--gold); }

  .loading { text-align: center; padding: 60px; color: var(--muted); font-size: 18px; letter-spacing: 2px; }
</style>

<div id="tct-app">
  <div class="tct-wrap">
    <div class="tct-header">

      <div class="modal-foot">
        <button class="btn btn-ghost" id="confirmNo">Cancelar</button>
        <button class="btn btn-red" id="confirmYes">Sí, continuar</button>

  <!-- Modal de PIN admin -->
  <div class="modal-bg" id="pinBg">
    <div class="modal">
      <h3 id="pinTitle">Modo admin</h3>
      <p id="pinMsg" style="font-weight:300;line-height:1.5;margin-bottom:16px;color:var(--muted);"></p>

  <!-- Modal de historial -->

      <div class="hist-tabs">

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ============================================================
  //  CONFIGURACIÓN DE SUPABASE  —  ⬇️ PON AQUÍ TUS 2 DATOS ⬇️
  //  (los obtienes en supabase.com → tu proyecto → Settings → API)
  // ============================================================
  const SUPABASE_URL = 'https://mhwialtlbwubxzthtdyu.supabase.co';        // ej: https://abcxyz.supabase.co
  const SUPABASE_ANON_KEY = 'sb_publishable_Km0hzlfDOFK1Cm07nojcuQ_DtXvb4jH'; // la llave "anon public"
  // ============================================================
</script>
<script>
(function () {
  const REQ = { cortos: 3, largos: 1 };       // requisito normal
  const REENTRY = { cortos: 4, largos: 2 };    // requisito para reingresar tras expulsión

  let state = {
    participants: [], // {id, name, type, banned}
    weeks: {},        // weekNum -> { [participantId]: [links] }
    currentWeek: 1,
    maxWeek: 1,
    adminPin: null,   // PIN de administrador (se configura la 1ra vez)
    startDate: null   // ISO del lunes de la Semana 1 (se fija al cargar por 1ra vez)
  };
  let selectedType = 'cortos';
  let isAdmin = false; // solo en esta sesión/navegador, no se guarda

  const $ = (id) => document.getElementById(id);

  // ---- Fechas: semanas Lunes→Domingo, cierre domingo 7pm ----
  function mondayOf(d) {
    const x = new Date(d);
    x.setHours(0, 0, 0, 0);
    const day = x.getDay();              // 0=dom ... 6=sáb
    const diff = (day === 0 ? -6 : 1 - day); // retroceder al lunes
    x.setDate(x.getDate() + diff);
    return x;
  }
  function weekStart(weekNum) {
    const base = state.startDate ? new Date(state.startDate) : mondayOf(new Date());
    const s = new Date(base);
    s.setDate(s.getDate() + (weekNum - 1) * 7);
    s.setHours(0, 0, 0, 0);
    return s;
  }
  function weekDeadline(weekNum) {
    const s = weekStart(weekNum);
    const dl = new Date(s);
    dl.setDate(dl.getDate() + 6);   // domingo
    dl.setHours(19, 0, 0, 0);       // 7:00 PM
    return dl;
  }
  function fmtShort(d) {
    return d.toLocaleDateString('es', { day: 'numeric', month: 'short' });
  }
  function fmtRange(weekNum) {
    const s = weekStart(weekNum);
    const e = new Date(s); e.setDate(e.getDate() + 6);
    return `${fmtShort(s)} – ${fmtShort(e)}`;
  }
  function fmtDeadline(weekNum) {
    const dl = weekDeadline(weekNum);
    return `Cierre: dom ${fmtShort(dl)} 7:00 PM`;
  }
  // Devuelve qué número de semana corresponde a hoy según startDate
  function currentRealWeek() {
    if (!state.startDate) return null;
    const base = mondayOf(new Date(state.startDate));
    const today = mondayOf(new Date());
    const diffWeeks = Math.round((today - base) / (7 * 86400000));
    return diffWeeks + 1;
  }

  // Confirmación con modal propio (confirm() nativo no funciona en artefactos)
  let _confirmCb = null;
  function askConfirm(message, onYes, title) {
    $('confirmTitle').textContent = title || 'Confirmar';
    $('confirmMsg').textContent = message;
    _confirmCb = onYes;
    $('confirmBg').classList.add('open');
  }

  // Aviso tipo toast (alert() nativo puede estar bloqueado en artefactos)
  function toast(msg) {
    let t = document.getElementById('tct-toast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'tct-toast';
      t.style.cssText = 'position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:#141420;color:#f5f3ea;border:1px solid #f4c542;border-radius:10px;padding:13px 20px;font-family:Oswald,sans-serif;font-size:14px;letter-spacing:.5px;z-index:100;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:90%;text-align:center;opacity:0;transition:opacity .2s;';
      document.getElementById('tct-app').appendChild(t);
    }
    t.textContent = msg;
    requestAnimationFrame(() => { t.style.opacity = '1'; });
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.opacity = '0'; }, 2800);
  }

  // ---- Conexión a Supabase ----
  let sb = null;
  let saveTimer = null;
  function initDB() {
    if (!window.supabase || SUPABASE_URL.startsWith('PEGA_AQUI')) {
      toast('Falta configurar Supabase en el código');
      return false;
    }
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    return true;
  }

  // Garantiza que el estado tenga todos los campos, vengan de donde vengan
  function normalizeState(s) {
    s = s && typeof s === 'object' ? s : {};
    if (!Array.isArray(s.participants)) s.participants = [];
    if (!s.weeks || typeof s.weeks !== 'object') s.weeks = {};
    if (typeof s.currentWeek !== 'number' || s.currentWeek < 1) s.currentWeek = 1;
    if (typeof s.maxWeek !== 'number' || s.maxWeek < 1) s.maxWeek = 1;
    if (s.currentWeek > s.maxWeek) s.currentWeek = s.maxWeek;
    if (!('adminPin' in s)) s.adminPin = null;
    if (!('startDate' in s)) s.startDate = null;
    return s;
  }

  async function load() {
    if (!initDB()) {
      // Sin DB configurada: arranca con estado por defecto para no romper la vista
      setupDates();
      if (!state.weeks[state.currentWeek]) state.weeks[state.currentWeek] = {};
      updateAdminBtn(); render();
      return;
    }
    try {
      const { data, error } = await sb.from('tct').select('data').eq('id', 1).maybeSingle();
      if (error) throw error;
      if (data && data.data) state = normalizeState(data.data);
    } catch (e) {
      console.error('Error leyendo Supabase', e);
      toast('No se pudo conectar a la base de datos');
    }
    state = normalizeState(state);
    setupDates();
    if (!state.weeks[state.currentWeek]) state.weeks[state.currentWeek] = {};
    updateAdminBtn();
    render();

    // Refresco automático: cada 8s trae cambios de otros miembros
    setInterval(refresh, 8000);
  }

  function setupDates() {
    if (!state.startDate) {
      const nextMon = mondayOf(new Date());
      nextMon.setDate(nextMon.getDate() + 7); // la Semana 1 empieza el PRÓXIMO lunes
      state.startDate = nextMon.toISOString();
      state.startShifted = true;
      save();
    } else if (!state.startShifted) {
      const d = new Date(state.startDate);
      d.setDate(d.getDate() + 7);
      state.startDate = d.toISOString();
      state.startShifted = true;
      save();
    }
  }

  async function refresh() {
    if (!sb) return;
    // No refrescar si hay un modal abierto (para no interrumpir al usuario)
    if (document.querySelector('.modal-bg.open')) return;
    try {
      const { data } = await sb.from('tct').select('data').eq('id', 1).maybeSingle();
      if (data && data.data) {
        const incoming = JSON.stringify(data.data);
        if (incoming !== JSON.stringify(state)) {
          const wasAdmin = isAdmin;
          state = normalizeState(data.data);
          if (!state.weeks[state.currentWeek]) state.weeks[state.currentWeek] = {};
          isAdmin = wasAdmin;
          render();
        }
      }
    } catch (e) { /* silencioso */ }
  }

  async function save() {
    if (!sb) return;
    // Debounce: agrupa cambios rápidos en una sola escritura
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try {
        const { error } = await sb.from('tct').upsert({ id: 1, data: state });
        if (error) throw error;
      } catch (e) {
        console.error('No se pudo guardar', e);
        toast('No se pudo guardar en la base de datos');
      }
    }, 400);
  }

  function weekData() {
    if (!state.weeks[state.currentWeek]) state.weeks[state.currentWeek] = {};
    return state.weeks[state.currentWeek];
  }

  function requirementFor(p) {
    // Si está expulsado, su requisito de reingreso es mayor
    return p.banned ? REENTRY[p.type] : REQ[p.type];
  }

  function render() {
    const realWk = currentRealWeek();
    const isNow = realWk === state.currentWeek;
    $('weekLabel').textContent = 'Semana ' + state.currentWeek + (isNow ? ' • ACTUAL' : '');
    $('weekRange').textContent = fmtRange(state.currentWeek);
    $('weekDeadline').textContent = fmtDeadline(state.currentWeek);
    $('prevWeek').disabled = state.currentWeek <= 1;
    $('nextWeek').disabled = state.currentWeek >= state.maxWeek;

    const wd = weekData();
    const cortos = state.participants.filter(p => p.type === 'cortos');
    const largos = state.participants.filter(p => p.type === 'largos');

    // stats
    let okCount = 0, failCount = 0, banned = 0;
    state.participants.forEach(p => {
      const n = (wd[p.id] || []).length;
      if (n >= requirementFor(p)) okCount++; else failCount++;
      if (p.banned) banned++;
    });
    $('stats').innerHTML = `
      <div class="stat"><div class="n">${state.participants.length}</div><div class="l">Miembros</div></div>
      <div class="stat g"><div class="n">${okCount}</div><div class="l">Cumplieron</div></div>
      <div class="stat r"><div class="n">${failCount}</div><div class="l">En riesgo</div></div>
      <div class="stat y"><div class="n">${banned}</div><div class="l">Expulsados</div></div>`;

    const content = $('content');
    if (state.participants.length === 0) {
      content.innerHTML = `<div class="empty">Aún no hay participantes. Pulsa <strong>+ Nuevo participante</strong> para empezar.</div>`;
      return;
    }

    content.innerHTML = `
      <div class="tct-cols">
        <div class="tct-col cortos">
          <h2>Cortos <span class="pill">${cortos.length}</span></h2>
          ${cortos.map(cardHTML).join('') || emptyCol()}
        </div>
        <div class="tct-col largos">
          <h2>Largos <span class="pill">${largos.length}</span></h2>
          ${largos.map(cardHTML).join('') || emptyCol()}
        </div>
      </div>`;

    bindCardEvents();
  }

  function emptyCol() { return `<div class="empty">Sin creadores en esta categoría.</div>`; }

  function cardHTML(p) {
    const wd = weekData();
    const links = wd[p.id] || [];
    const req = requirementFor(p);
    const n = links.length;
    const done = n >= req;
    let statusClass = done ? 's-ok' : (n > 0 ? 's-pend' : 's-bad');
    let cardClass = done ? 'done' : (n > 0 ? '' : 'fail');
    if (p.banned) cardClass += ' banned';

    const reqNote = p.banned
      ? `Reingreso: necesita ${req} videos esta semana`
      : `Requisito: ${req} video${req > 1 ? 's' : ''} / semana`;

    return `
      <div class="card ${cardClass}" data-id="${p.id}">
        <div class="card-top">
          <div>
            <div class="card-name">${escapeHTML(p.name)}</div>
            <div class="req-note">${reqNote}</div>
          </div>
          <div class="card-status ${statusClass}">
            <span class="num">${n}</span>/${req}
            <div style="font-size:11px;letter-spacing:1px;">${done ? 'CUMPLE ✓' : 'FALTAN ' + Math.max(0, req - n)}</div>
          </div>
        </div>
        <div class="links">
          ${links.map((l, i) => `
            <div class="link-row">
              <a href="${escapeAttr(l)}" target="_blank" rel="noopener">${escapeHTML(l)}</a>
              <span class="del" data-del="${i}" title="Eliminar link">✕</span>
            </div>`).join('')}
        </div>
        <div class="add-link">
          <input type="text" placeholder="Pega el link del video…" data-input="${p.id}" />
          <button class="btn btn-gold btn-sm" data-addlink="${p.id}">Subir</button>
        </div>
        ${isAdmin ? `<div class="add-link" style="margin-top:8px;">
          ${p.banned
            ? `<button class="btn btn-ghost btn-sm" data-reinstate="${p.id}">Readmitir al grupo</button>`
            : `<button class="btn btn-red btn-sm" data-ban="${p.id}">Expulsar del grupo</button>`}
          <button class="btn btn-ghost btn-sm" data-remove="${p.id}">Borrar</button>
        </div>` : ''}
      </div>`;
  }

  function bindCardEvents() {
    document.querySelectorAll('[data-addlink]').forEach(b => {
      b.onclick = () => {
        const id = b.getAttribute('data-addlink');
        const input = document.querySelector(`[data-input="${id}"]`);
        const val = input.value.trim();
        if (!val) return;
        const wd = weekData();
        if (!wd[id]) wd[id] = [];
        wd[id].push(val);
        save(); render();
      };
    });
    document.querySelectorAll('[data-input]').forEach(inp => {
      inp.onkeydown = (e) => {
        if (e.key === 'Enter') {
          const id = inp.getAttribute('data-input');
          document.querySelector(`[data-addlink="${id}"]`).click();
        }
      };
    });
    document.querySelectorAll('[data-del]').forEach(d => {
      d.onclick = () => {
        const card = d.closest('.card');
        const id = card.getAttribute('data-id');
        const idx = parseInt(d.getAttribute('data-del'));
        weekData()[id].splice(idx, 1);
        save(); render();
      };
    });
    document.querySelectorAll('[data-ban]').forEach(b => {
      b.onclick = () => {
        if (!isAdmin) { toast('Solo el admin puede expulsar miembros'); return; }
        const p = state.participants.find(x => x.id === b.getAttribute('data-ban'));
        if (!p) return;
        askConfirm(`¿Expulsar a ${p.name} del grupo? Para volver deberá subir ${REENTRY[p.type]} videos en una semana.`, () => {
          p.banned = true; save(); render();
        }, 'Expulsar del grupo');
      };
    });
    document.querySelectorAll('[data-reinstate]').forEach(b => {
      b.onclick = () => {
        if (!isAdmin) { toast('Solo el admin puede readmitir miembros'); return; }
        const p = state.participants.find(x => x.id === b.getAttribute('data-reinstate'));
        if (p) { p.banned = false; save(); render(); }
      };
    });
    document.querySelectorAll('[data-remove]').forEach(b => {
      b.onclick = () => {
        if (!isAdmin) { toast('Solo el admin puede borrar miembros'); return; }
        const p = state.participants.find(x => x.id === b.getAttribute('data-remove'));
        if (!p) return;
        askConfirm(`¿Borrar definitivamente a ${p.name} y todo su historial?`, () => {
          state.participants = state.participants.filter(x => x.id !== p.id);
          Object.values(state.weeks).forEach(w => delete w[p.id]);
          save(); render();
        }, 'Borrar participante');
      };
    });
  }

  // Modal
  $('addBtn').onclick = () => { $('mName').value = ''; setType('cortos'); $('modalBg').classList.add('open'); $('mName').focus(); };
  $('cancelAdd').onclick = () => $('modalBg').classList.remove('open');
  $('modalBg').onclick = (e) => { if (e.target === $('modalBg')) $('modalBg').classList.remove('open'); };
  $('tCortos').onclick = () => setType('cortos');
  $('tLargos').onclick = () => setType('largos');
  function setType(t) {
    selectedType = t;
    $('tCortos').classList.toggle('active', t === 'cortos');
    $('tLargos').classList.toggle('active', t === 'largos');
  }
  $('confirmAdd').onclick = () => {
    const name = $('mName').value.trim();
    if (!name) { $('mName').focus(); return; }
    state.participants.push({ id: 'p' + Date.now() + Math.random().toString(36).slice(2, 6), name, type: selectedType, banned: false });
    $('modalBg').classList.remove('open');
    save(); render();
  };
  $('mName').onkeydown = (e) => { if (e.key === 'Enter') $('confirmAdd').click(); };

  // Modal de confirmación
  $('confirmNo').onclick = () => { _confirmCb = null; $('confirmBg').classList.remove('open'); };
  $('confirmBg').onclick = (e) => { if (e.target === $('confirmBg')) { _confirmCb = null; $('confirmBg').classList.remove('open'); } };
  $('confirmYes').onclick = () => {
    const cb = _confirmCb; _confirmCb = null;
    $('confirmBg').classList.remove('open');
    if (cb) cb();
  };

  // ---- Modo admin (PIN) ----
  function updateAdminBtn() {
    const btn = $('adminBtn');
    if (isAdmin) {
      btn.textContent = '🔓 Salir de admin';
      btn.classList.remove('btn-ghost'); btn.classList.add('btn-gold');
    } else {
      btn.textContent = '🔒 Modo admin';
      btn.classList.add('btn-ghost'); btn.classList.remove('btn-gold');
    }
  }
  function openPin(mode) {
    // mode: 'set' (configurar primera vez) | 'enter' (ingresar)
    $('pinInput').value = '';
    if (mode === 'set') {
      $('pinTitle').textContent = 'Configurar PIN';
      $('pinMsg').textContent = 'Aún no hay PIN de administrador. Crea uno ahora; será el único que pueda borrar miembros. No lo compartas.';
      $('pinLabel').textContent = 'Nuevo PIN (mín. 4 dígitos)';
      $('pinOk').textContent = 'Guardar PIN';
      $('pinBg').dataset.mode = 'set';
    } else {
      $('pinTitle').textContent = 'Modo admin';
      $('pinMsg').textContent = 'Ingresa el PIN de administrador para poder borrar miembros.';
      $('pinLabel').textContent = 'PIN de administrador';
      $('pinOk').textContent = 'Entrar';
      $('pinBg').dataset.mode = 'enter';
    }
    $('pinBg').classList.add('open');
    setTimeout(() => $('pinInput').focus(), 50);
  }
  $('adminBtn').onclick = () => {
    if (isAdmin) {                       // ya es admin → salir
      isAdmin = false; updateAdminBtn(); render();
      toast('Saliste del modo admin');
      return;
    }
    if (!state.adminPin) openPin('set'); // no hay PIN aún → configurar
    else openPin('enter');               // pedir PIN
  };
  $('pinCancel').onclick = () => $('pinBg').classList.remove('open');
  $('pinBg').onclick = (e) => { if (e.target === $('pinBg')) $('pinBg').classList.remove('open'); };
  $('pinOk').onclick = () => {
    const val = $('pinInput').value.trim();
    const mode = $('pinBg').dataset.mode;
    if (mode === 'set') {
      if (val.length < 4) { toast('El PIN debe tener al menos 4 dígitos'); return; }
      state.adminPin = val;
      isAdmin = true;
      $('pinBg').classList.remove('open');
      save(); updateAdminBtn(); render();
      toast('PIN configurado. Ya estás en modo admin ✅');
    } else {
      if (val === state.adminPin) {
        isAdmin = true;
        $('pinBg').classList.remove('open');
        updateAdminBtn(); render();
        toast('Modo admin activado ✅');
      } else {
        toast('PIN incorrecto');
        $('pinInput').value = '';
      }
    }
  };
  $('pinInput').onkeydown = (e) => { if (e.key === 'Enter') $('pinOk').click(); };

  // ---- Historial ----
  let histView = 'table';
  function metForWeek(p, wk) {
    const wd = state.weeks[wk] || {};
    const n = (wd[p.id] || []).length;
    return n >= (REQ[p.type]); // historial usa el requisito normal del tipo
  }
  function countForWeek(p, wk) {
    const wd = state.weeks[wk] || {};
    return (wd[p.id] || []).length;
  }
  function renderHistory() {
    $('htTable').classList.toggle('active', histView === 'table');
    $('htPerson').classList.toggle('active', histView === 'person');
    const body = $('histBody');
    const weeks = [];
    for (let w = 1; w <= state.maxWeek; w++) weeks.push(w);

    if (state.participants.length === 0) {
      body.innerHTML = `<div class="empty">Aún no hay participantes ni historial.</div>`;
      return;
    }

    if (histView === 'table') {
      const sorted = [...state.participants].sort((a, b) => a.type.localeCompare(b.type) || a.name.localeCompare(b.name));
      let html = `<table class="hist-table"><thead><tr><th style="text-align:left;">Participante</th>`;
      weeks.forEach(w => { html += `<th class="hist-week-h">Sem ${w}<small>${fmtRange(w)}</small></th>`; });
      html += `<th>Cumplidas</th></tr></thead><tbody>`;
      sorted.forEach(p => {
        let met = 0, cells = '';
        weeks.forEach(w => {
          const ok = metForWeek(p, w); const c = countForWeek(p, w);
          if (ok) met++;
          cells += `<td class="${ok ? 'cell-ok' : 'cell-bad'}">${ok ? '✓' : '✗'}<span class="cell-tag">${c}/${REQ[p.type]}</span></td>`;
        });
        html += `<tr><td class="nm">${escapeHTML(p.name)}<small>${p.type}${p.banned ? ' · expulsado' : ''}</small></td>${cells}<td><strong>${met}/${weeks.length}</strong></td></tr>`;
      });
      html += `</tbody></table>`;
      body.innerHTML = html;
    } else {
      const sorted = [...state.participants].sort((a, b) => a.name.localeCompare(b.name));
      body.innerHTML = sorted.map(p => {
        let met = 0;
        const dots = weeks.map(w => {
          const ok = metForWeek(p, w); if (ok) met++;
          return `<div class="dot ${ok ? 'ok' : 'bad'}" title="Semana ${w}: ${countForWeek(p, w)}/${REQ[p.type]}">S${w}</div>`;
        }).join('');
        const rate = weeks.length ? Math.round(met / weeks.length * 100) : 0;
        const rateColor = rate >= 80 ? 'var(--green)' : (rate >= 50 ? 'var(--gold)' : 'var(--red)');
        return `<div class="person-card">
          <div class="ph">
            <div class="nm">${escapeHTML(p.name)} <span style="color:var(--muted);font-size:12px;text-transform:uppercase;">· ${p.type}${p.banned ? ' · expulsado' : ''}</span></div>
            <div class="rate" style="color:${rateColor}">${rate}%</div>
          </div>
          <div class="streak">${dots}</div>
        </div>`;
      }).join('');
    }
  }
  $('historyBtn').onclick = () => { histView = 'table'; renderHistory(); $('histBg').classList.add('open'); };
  $('histClose').onclick = () => $('histBg').classList.remove('open');
  $('histBg').onclick = (e) => { if (e.target === $('histBg')) $('histBg').classList.remove('open'); };
  $('htTable').onclick = () => { histView = 'table'; renderHistory(); };
  $('htPerson').onclick = () => { histView = 'person'; renderHistory(); };

  // Navegación de semanas
  $('prevWeek').onclick = () => { if (state.currentWeek > 1) { state.currentWeek--; save(); render(); } };
  $('nextWeek').onclick = () => { if (state.currentWeek < state.maxWeek) { state.currentWeek++; save(); render(); } };
  $('newWeekBtn').onclick = () => {
    state.maxWeek++;
    state.currentWeek = state.maxWeek;
    state.weeks[state.currentWeek] = {};
    save(); render();
  };

  // Copiar lista de incumplidos
  $('copyFailBtn').onclick = () => {
    const wd = weekData();
    const fails = state.participants.filter(p => (wd[p.id] || []).length < requirementFor(p));
    if (fails.length === 0) {
      toast('¡Nadie incumplió esta semana! Todos a salvo.');
      return;
    }
    let txt = `⚔️ TODOS CONTRA TEBAS — Semana ${state.currentWeek}\n`;
    txt += `Incumplidos (deben salir del grupo):\n\n`;
    fails.forEach(p => {
      const n = (wd[p.id] || []).length;
      const req = requirementFor(p);
      txt += `• ${p.name} (${p.type}) — subió ${n}/${req}\n`;
    });
    const done = () => toast('Lista de incumplidos copiada ✅');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done).catch(() => fallbackCopy(txt, done));
    } else { fallbackCopy(txt, done); }
  };
  function fallbackCopy(txt, cb) {
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); cb(); } catch (e) { toast('No se pudo copiar automáticamente'); }
    document.body.removeChild(ta);
  }

  function escapeHTML(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function escapeAttr(s) { let v = String(s); if (!/^https?:\/\//i.test(v)) v = 'https://' + v; return escapeHTML(v); }

  load();
})();
</script>
